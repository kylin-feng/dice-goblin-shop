<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Stats — Dice Goblin (private)</title>
<style>
  :root { --bg:#14100d; --card:#1e1813; --line:#3a2f22; --ink:#e9e0cc; --dim:#9c8f74; --gold:#c9a227; --green:#3f9d6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.55 "Segoe UI",system-ui,sans-serif; padding:28px 20px; }
  .wrap { max-width:900px; margin:0 auto; }
  h1 { font-size:1.3rem; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:.85rem; margin-bottom:22px; }
  .gate { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:26px; max-width:420px; margin:40px auto; text-align:center; }
  .gate input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:1rem; margin:10px 0; }
  .gate button, button.refresh { background:var(--gold); border:none; color:#241a08; font-weight:700; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:.95rem; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:26px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-top:3px solid var(--green); border-radius:10px; padding:14px 16px; }
  .kpi .n { font-size:1.9rem; font-weight:700; }
  .kpi .l { color:var(--dim); font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; }
  h2 { font-size:1.02rem; color:var(--gold); margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; font-size:.92rem; }
  th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; font-size:.78rem; text-transform:uppercase; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .bar { background:var(--green); height:9px; border-radius:4px; min-width:2px; }
  .bar.gold { background:var(--gold); }
  .updated { color:var(--dim); font-size:.8rem; margin-top:18px; }
  function row() {}
</style>
</head>
<body>
<div class="wrap">
  <h1>&#129054;#127922; Dice Goblin — shop dashboard</h1>
  <p class="sub">Anonymous counters · namespace dicegoblin-x7q2v · updated on refresh</p>
  <div id="app"><div class="gate"><p>Enter admin pass</p><input id="pw" type="password" placeholder="pass phrase"><br><button onclick="tryOpen()">Open dashboard</button></div></div>
</div>
<script>
const NS = "dicegoblin-x7q2v", PASS = "goblin-hoard-2026";
const GET = k => fetch(`https://abacus.jasoncameron.dev/get/${NS}/${k}`).then(r => r.ok ? r.json() : {value:0}).then(j => j.value || 0).catch(() => 0);
const PAGES = [["home","Home"],["products-metal-dice-bundle","Metal Bundle (PDP)"],["products-resin-dice-set","Resin Set (PDP)"],["products-folding-dice-tray","Dice Tray (PDP)"],["faq","FAQ"],["shipping","Shipping"],["returns","Returns"],["contact","Contact"],["privacy","Privacy"]];
const SRCS = ["google","bing","duckduckgo","reddit","pinterest","facebook","x","youtube","internal","direct"];
const EVTS = ["checkout-view.metal-dice-bundle","buy-click.metal-dice-bundle","buy-success.metal-dice-bundle","checkout-view.resin-dice-set","buy-click.resin-dice-set","checkout-view.folding-dice-tray","buy-click.folding-dice-tray","view.metal-dice-bundle","view.resin-dice-set","view.folding-dice-tray","out.printable-dm"];
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function rowHTML(name, val, max, gold){ const w = max ? Math.round(val/max*100) : 0; return `<tr><td>${esc(name)}</td><td><div class="bar${gold?" gold":""}" style="width:${w}%"></div></td><td class="num">${val}</td></tr>`; }
function barTable(rows, gold){ const max = Math.max(1, ...rows.map(r=>r[1])); return `<table><tr><th>Dimension</th><th style="width:55%"></th><th class="num">Count</th></tr>${rows.map(r=>rowHTML(r[0],r[1],max,gold)).join("")}</table>`; }

async function load() {
  const app = document.getElementById("app");
  app.innerHTML = "<p style='color:var(--dim)'>Loading counters…</p>";
  const [uv, pvArr, srcArr, evtArr] = await Promise.all([
    GET("uv.all"),
    Promise.all(PAGES.map(p => GET("pv." + p[0]))),
    Promise.all(SRCS.map(s => GET("src." + s))),
    Promise.all(EVTS.map(e => GET("evt." + e))),
  ]);
  const pvTotal = pvArr.reduce((a,b)=>a+b,0);
  const checkoutViews = PAGES.filter(p=>p[0].startsWith("products-")).reduce((a,p,i)=> {
    const idx = PAGES.indexOf(p); return a; }, 0);
  const buyClicks = EVTS.reduce((a,e,i)=> a + (e.startsWith("buy-click.") ? evtArr[i] : 0), 0);
  const buySuccess = EVTS.reduce((a,e,i)=> a + (e.startsWith("buy-success.") ? evtArr[i] : 0), 0);
  const app2 = document.getElementById("app");
  app2.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="n">${pvTotal}</div><div class="l">Page views</div></div>
      <div class="kpi"><div class="n">${uv}</div><div class="l">Unique visitors</div></div>
      <div class="kpi"><div class="n">${buyClicks}</div><div class="l">Buy clicks</div></div>
      <div class="kpi"><div class="n">${buySuccess}</div><div class="l">Paid orders</div></div>
    </div>
    <h2>Traffic by page</h2>${barTable(PAGES.map((p,i)=>[p[1], pvArr[i]]).sort((a,b)=>b[1]-a[1]))}
    <h2>Traffic by source</h2>${barTable(SRCS.map((s,i)=>[s, srcArr[i]]).sort((a,b)=>b[1]-a[1]))}
    <h2>Conversion events</h2>${barTable(EVTS.map((e,i)=>[e, evtArr[i]]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]), true)}
    <p class="updated">Loaded ${new Date().toLocaleString()} · <button class="refresh" onclick="load()">Refresh</button></p>`;
}
function tryOpen(){
  if (document.getElementById("pw").value === PASS) { sessionStorage.setItem("dg-stats","1"); load(); }
  else alert("Wrong pass.");
}
if (location.hash === "#" + PASS || sessionStorage.getItem("dg-stats")) load();
</script>
</body>
</html>
